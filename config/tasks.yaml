risk_manager_task:
  description: |
    As **Senior Risk Analyst** for {company_name}, orchestrate the comprehensive risk calculation.
    
    **YOUR SINGLE TASK:**
    Call the `calculate_tier1_comprehensive_risks` tool EXACTLY ONCE with:
      - `scenario_id`: "{scenario_id}"
      - `company_name`: "{company_name}"
    
    That is ALL. The tool loads all data from disk automatically (KG results, disruption
    metadata saved by the upstream KG agent). You do NOT need to pass kg_results or
    disruption_analysis — the tool retrieves them itself.
    
    This tool performs all heavy computation in deterministic Python:
      - Loads the full supply chain data saved by the KG agent
      - Calculates exposure depth, breadth, criticality, centrality
      - Aggregates downstream disruption impact to Tier-1
      - Returns complete risk assessment for ALL Tier-1 suppliers
    
    **CRITICAL OUTPUT HANDLING:**
    The tool returns the complete risk assessment. Your FINAL ANSWER = the tool's output EXACTLY.
      - Do NOT summarize or modify
      - Do NOT add commentary
      - Do NOT wrap in markdown
      - Return the complete JSON dict as-is
  expected_output: >
    Complete JSON object with supplier_risk_scores (dict of all Tier-1 suppliers), 
    tier1_risk_profiles (array), critical_suppliers (array), summary (object), 
    and methodology (object). This is the tool's output returned exactly as-is.
  agent: risk_manager_agent
  input_keys:
    - kg_results
    - disruption_analysis
    - company_name
    - scenario_id
  output_keys:
    - risk_assessment
    - company_name

decision_making_task:
  description: |
    You are the Chief Supply Chain Officer of {company_name}. You have received the Risk Manager's assessment of every
    Tier-1 supplier affected by the disruption. Decide one action for every Tier-1 supplier and justify each listed
    decision with the data in the assessment.

    Actions:
      - REPLACE_SUPPLIER: find an alternative supplier now
      - INCREASE_MONITORING: track the supplier closely and prepare contingencies
      - MAINTAIN_STANDARD: no immediate action

    Decision rule, applied to the raw risk_score in risk_assessment.supplier_risk_scores, without rounding:
      - 0.60 or above (HIGH): REPLACE_SUPPLIER
      - 0.45 or above and below 0.60 (MEDIUM): INCREASE_MONITORING
      - below 0.45 (LOW): MAINTAIN_STANDARD
    For example: 0.60 is HIGH; 0.59 is MEDIUM; 0.45 is MEDIUM; 0.44 is LOW.

    List every Tier-1 supplier whose raw score is 0.45 or above, in descending order of score, with its decision and
    justification. Every supplier you do not list is MAINTAIN_STANDARD. If no supplier scores 0.45 or above, the
    decisions object is empty.

    Justification. In one or two sentences per supplier, state what drives its score, using only values in the
    assessment: the raw score and risk level; the disrupted companies in its upstream network by tier
    (disrupted_counts_by_tier) and the deepest disrupted tier; the countries of the disrupted companies
    (top_disrupted_countries); and the component values in component_breakdown (exposure, dependency, sub-supplier
    criticality, centrality, depth). The score is a weighted index of these components, not a percentage or a
    probability. Do not state anything the assessment does not contain: no costs, lead times, timelines,
    production volumes, factories, products or alternative suppliers.

    Output, as a JSON object and nothing else:
    {
      "company_name": "{company_name}",
      "decisions": {
        "<Tier-1 supplier name>": {
          "risk_score_raw": 0.61,
          "risk_level": "HIGH",
          "action": "REPLACE_SUPPLIER",
          "justification": {
            "risk_analysis": "Raw score 0.61 (HIGH), driven mainly by exposure (0.72) and dependency (0.55).",
            "exposure_details": {
              "total_disrupted_nodes": 14,
              "by_tier": {"tier_2": 2, "tier_3": 5, "tier_4": 7},
              "top_disrupted_countries": ["<country>"]
            },
            "action_rationale": "Score at or above 0.60: REPLACE_SUPPLIER."
          }
        },
        "<another Tier-1 supplier name>": {
          "risk_score_raw": 0.52,
          "risk_level": "MEDIUM",
          "action": "INCREASE_MONITORING",
          "justification": {
            "risk_analysis": "Raw score 0.52 (MEDIUM); disrupted companies at Tier 3 and Tier 4 only.",
            "exposure_details": {
              "total_disrupted_nodes": 6,
              "by_tier": {"tier_2": 0, "tier_3": 2, "tier_4": 4},
              "top_disrupted_countries": ["<country>"]
            },
            "action_rationale": "Score from 0.45 to below 0.60: INCREASE_MONITORING."
          }
        }
      },
      "decision_report": {
        "executive_summary": "<n> REPLACE_SUPPLIER (score 0.60 or above), <m> INCREASE_MONITORING (0.45 to below 0.60), <k> MAINTAIN_STANDARD (below 0.45).",
        "action_summary": {
          "total_tier1_suppliers_analyzed": "<number of suppliers in supplier_risk_scores>",
          "replace_supplier_count": "<n>",
          "increase_monitoring_count": "<m>",
          "maintain_standard_count": "<total minus n minus m>",
          "critical_suppliers": ["<suppliers scoring 0.60 or above>"]
        }
      }
    }
    The values in this example illustrate the format only; take every value from the assessment.
  expected_output: >
    A JSON object with company_name, decisions (every Tier-1 supplier scoring 0.45 or above, with risk_score_raw,
    risk_level, action and a justification drawn only from the risk assessment) and decision_report, and no other text.
  agent: chief_supply_chain_agent
  input_keys:
    - risk_assessment
    - disruption_analysis
    - company_name
  output_keys:
    - decisions
    - decision_report
    - risk_summary
    - company_name
    - decision_timestamp
    - executive_report


sourcing_task:
  description: |
    As **Sourcing Specialist**, execute the Tier-1 supplier actions defined by the Chief Supply Chain Officer.
    - Only act on Tier-1 suppliers flagged in the decision plan (replacement, buffering, dual-sourcing).
    - For replacement requests, search for alternative Tier-1 candidates matching product, quality, lead-time, and geography requirements.
    - Evaluate potential suppliers based on cost, lead time, stability, and deliverable fit; summarise findings in structured JSON.
    - Provide updated supply chain mapping (Tier-0 → Tier-1) for any approved alternatives.
  expected_output: >
    A JSON object detailing the alternative suppliers found, their evaluation scores, and the updated supply chain map if applicable.
  agent: sourcing_agent
  input_keys:
  - decisions
  output_keys:
  - sourcing_results