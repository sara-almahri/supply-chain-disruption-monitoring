scrape_news_task:
  description: |
    Extract the news article text. The article text is already provided in the task inputs as `extracted_text`.
    
    **YOUR TASK:**
    - The task inputs contain `extracted_text` with the complete news article
    - Return the `extracted_text` value directly as your output
    - DO NOT scrape URLs
    - DO NOT call tools
    - DO NOT modify the text
    - Simply return: {extracted_text}
  expected_output: >
    Return the extracted_text value from task inputs exactly as provided
  agent: disruption_monitoring_agent
  input_keys:
    - extracted_text
    - website_url
  output_keys:
    - extracted_text


analyze_disruptions_task:
  description: |
    You are a supply chain disruption analyst working for {company_name}. Read the news article below and record
    what it reports. You do not know {company_name}'s suppliers: whether a disruption reaches them is established
    afterwards from the knowledge graph. Report only what the article states.

    Article:
    """
    {extracted_text}
    """

    Work through the following steps in order.

    1. Ongoing disruption. Decide whether the article reports a disruption that is under way: an event that is
       currently stopping or reducing production, supply, transport or trade. Set "ongoing_disruption" to false when
       the article reports no disruption (for example company results, investment, appointments, product launches or
       routine trade figures), a disruption that has ended or been resolved (a strike that has ended, a port that has
       reopened, sanctions that have been lifted), a past disruption described as history, or only a forecast, warning
       or threat of a future disruption.

    2. Type. If there is an ongoing disruption, classify it with exactly one of these labels:
       - "Geopolitical": wars, sanctions, political instability, territorial disputes
       - "Trade Policy": tariffs, trade wars, import or export restrictions, embargoes
       - "Natural Disaster": earthquakes, floods, hurricanes, volcanic eruptions, wildfires
       - "Labour Strike": worker strikes, union disputes, labour shortages, walkouts
       - "Economic Crisis": recessions, currency collapse, hyperinflation, financial crises
       - "Company Bankruptcy": corporate insolvency, liquidation, financial distress
       - "Cyber Attack": ransomware, data breaches, IT disruptions
       - "Pandemic": disease outbreaks, health emergencies
       - "Other": a disruption that fits none of the labels above
       Use the most specific label: a labour strike is not an economic crisis, and a trade war is not geopolitical.
       If there is no ongoing disruption, the type is "None".

    3. Countries, industries and companies. List only what the article states is disrupted. Do not add countries,
       industries or companies from your own knowledge, and do not list those mentioned only as background, as sources
       of comment, as customers or as unaffected.
       - countries: each country in which the disruption is taking place, by its English name (for example "USA",
         "United Kingdom", "South Korea"). If the article names a region, list the countries it names within it.
       - industries: each disrupted industry, using a name from this list when one applies: "Aerospace & Defense",
         "Automotive", "Cable & Satellite", "Chemicals", "Construction Materials", "Diversified Industrials",
         "Electric Utilities", "Electrical Equipment", "Engineering & Construction", "Gas & Water Utilities",
         "Industrial Intermediate Prod", "Machinery", "Medical Equipment & Devices", "Metals & Mining",
         "Oil & Gas Producers", "Oil & Gas Services & Equip", "Renewable Energy", "Semiconductors", "Steel",
         "Technology Hardware", "Technology Services", "Telecommunications", "Transportation & Logistics",
         "Transportation Equipment". For a disrupted industry not in the list, give its name as the article does.
       - companies: each company the article names as disrupted, with the name the article uses.

    4. Scope. Set "scope" to "industries" when the article confines the disruption to the industries you listed (for
       example a strike at copper mines, a cyber attack on chip makers, export controls on steel). Set it to "country"
       when the disruption affects economic activity in the listed countries generally (for example a war, an
       earthquake, a national lockdown, a currency collapse, a general strike).

    5. Summary. In at most two sentences, state what the article reports. Do not speculate about consequences.

    Begin the JSON with "reasoning": two to four sentences on what the article reports, whether it is still under
    way, and what it affects. If there is no ongoing disruption, the type is "None", the scope is "country" and the
    three lists are empty.

    Example 1. Article: "Workers at three copper mines operated by Andes Ridge Mining in northern Chile walked out on
    Monday, halting output at the sites. The union said the strike would continue until wages are renegotiated."
    {
      "reasoning": "The article reports a strike that began on Monday and is continuing, halting output at three copper mines in Chile. It affects mining only and names one company.",
      "ongoing_disruption": true,
      "type": "Labour Strike",
      "scope": "industries",
      "involved": {"countries": ["Chile"], "industries": ["Metals & Mining"], "companies": ["Andes Ridge Mining"]},
      "summary": "A strike has halted output at three Andes Ridge Mining copper mines in northern Chile and is continuing."
    }

    Example 2. Article: "Dockworkers at the port of Antwerp returned to work on Friday after a two-week strike ended
    with a new wage agreement. Shipping schedules are back to normal."
    {
      "reasoning": "The article reports that a port strike has ended and that operations are back to normal. No disruption is under way.",
      "ongoing_disruption": false,
      "type": "None",
      "scope": "country",
      "involved": {"countries": [], "industries": [], "companies": []},
      "summary": "A two-week dockworkers' strike at the port of Antwerp has ended and shipping is back to normal."
    }

    Return only the JSON object, with no other text.
  expected_output: >
    A JSON object with keys reasoning, ongoing_disruption (true or false), type, scope ("country" or "industries"),
    involved (countries, industries, companies) and summary, and no other text.
  agent: disruption_monitoring_agent
  input_keys:
    - extracted_text
    - company_name
  output_keys:
    - disruption_analysis
    - company_name


kg_query_task:
  description: |
    You map the disruption reported by the Disruption Monitoring Agent onto {company_name}'s supply network.

    Call the `build_and_save_kg` tool exactly once, with these arguments taken from the disruption analysis:
      - monitored_company: "{company_name}"
      - ongoing_disruption: the value of ongoing_disruption
      - disrupted_countries: involved.countries
      - disrupted_industries: involved.industries
      - disrupted_companies: involved.companies
      - scope: the value of scope
      - scenario_id: "{scenario_id}"
    Copy every value exactly. Do not add, remove, translate or correct any name; the tool resolves names to the
    knowledge graph and reports any it cannot resolve. Use an empty list for a missing list.

    The tool finds every Tier-1 to Tier-4 supply path of {company_name} that ends at a disrupted company, saves the
    paths to disk and returns their metadata. Its result is your answer.
  expected_output: >
    The metadata returned by build_and_save_kg: kg_payload_path, monitored_company, ongoing_disruption, scope, the
    resolved countries, industries and companies, unresolved names, chain_counts and total_chains.
  agent: kg_query_agent
  input_keys:
    - disruption_analysis
    - company_name
    - scenario_id
  output_keys:
    - kg_results
    - company_name


