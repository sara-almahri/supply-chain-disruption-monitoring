    For **ALL** companies in `kg_results`, do the following:
    1. For **EVERY** company in Tier-4, Tier-3, Tier-2, and Tier-1, use the SerperDevTool to search for the products they supply.
    2. For **EVERY** relationship in the supply chain (e.g., Tier-4 → Tier-3, Tier-3 → Tier-2, Tier-2 → Tier-1, Tier-1 → {company_name}), identify the **product supplied** between the two companies.
    3. **PRESERVE THE TIER STRUCTURE** from `kg_results` and add the **product supplied** at each step.
    4. **DO NOT SPLIT OR DISCONNECT THE CHAINS** – ensure each chain is complete from Tier-4 to {company_name}.
    5. **INCLUDE ALL COMPANIES** in the disruption, ensuring no gaps or missing links.

  expected_output: >
